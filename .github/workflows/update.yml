name: Update Clash Rules

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    # 每日 UTC 12:00（北京时间 20:00）
    - cron: '0 12 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

# 避免定时与手动触发并发时对 rules 分支的 --force 推送互相覆盖
concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build
        run: go build -o builder ./cmd/builder

      - name: Run builder
        run: ./builder

      - name: Validate and stage artifacts
        run: |
          go run ./cmd/check
          mkdir -p "$RUNNER_TEMP/rules-publish/loon"
          cp rules/*.yaml geoip/*.mmdb "$RUNNER_TEMP/rules-publish/"
          cp rules/loon/*.lsr rules/loon/*.lcf rules/loon/LICENSE rules/loon/README.md "$RUNNER_TEMP/rules-publish/loon/"

      - name: Get date
        id: date
        run: |
          echo "tag=$(date -u '+%Y%m%d%H%M%S%3N')" >> $GITHUB_OUTPUT

      - name: Push to rules branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout --orphan rules
          git rm -rf .
          cp -R "$RUNNER_TEMP/rules-publish/." .
          git add -f *.yaml *.mmdb loon/
          git diff --staged --quiet || git commit -m "chore: 更新规则文件 [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin rules --force

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个 rules- 开头的 tag
          PREV_TAG=$(git tag -l "rules-*" --sort=-version:refname | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ]; then
            # 首次发布，显示最近的 main 分支提交
            NOTES=$(git log main --pretty=format:"- %s by @%an" -10)
          else
            # 从 tag 中提取时间戳作为 --since 过滤
            # tag 格式: rules-YYYYMMDDHHMMSSMMM
            TAG_DATE=${PREV_TAG#rules-}
            YEAR=${TAG_DATE:0:4}
            MONTH=${TAG_DATE:4:2}
            DAY=${TAG_DATE:6:2}
            HOUR=${TAG_DATE:8:2}
            MIN=${TAG_DATE:10:2}
            SEC=${TAG_DATE:12:2}
            SINCE_DATE="${YEAR}-${MONTH}-${DAY}T${HOUR}:${MIN}:${SEC}Z"
            NOTES=$(git log main --pretty=format:"- %s by @%an" --since="$SINCE_DATE" 2>/dev/null || echo "- 规则更新")
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rules-${{ steps.date.outputs.tag }}
          name: Clash Rules ${{ steps.date.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ runner.temp }}/rules-publish/*.yaml
            ${{ runner.temp }}/rules-publish/*.mmdb
            ${{ runner.temp }}/rules-publish/loon/*.lsr
            ${{ runner.temp }}/rules-publish/loon/*.lcf
            ${{ runner.temp }}/rules-publish/loon/LICENSE
            ${{ runner.temp }}/rules-publish/loon/README.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
